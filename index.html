const docsLabels=['Présentation machine','Actigramme fonctionnel','Implantation platine','Puissance · folio 16','Commande · folio 17','Signalisation · folio 18','Bornier','Nomenclature A','Nomenclature B','Plaque pompe','Implantation organes','Notice maintenance 1','Notice maintenance 2'];
const KEY='aquaticc_at i_v1'.replace(' ','');
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
const state={mission:0,q:0,tab:'mission',doc:'D01',results:saved.results||{},names:saved.names||'',report:saved.report||{},start:saved.start||Date.now(),showCourse:false,feedback:false};
function store(){localStorage.setItem(KEY,JSON.stringify({results:state.results,names:state.names,report:state.report,start:state.start}))}
const $=x=>document.querySelector(x);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function qdone(q){let r=state.results[q.id];return !!r&&r.checked&&r.answer?.trim().length>0}
function progress(){return questions.filter(qdone).length}
function missionProgress(m){let all=questions.filter(x=>x.m===m);return `${all.filter(qdone).length}/${all.length}`}
function setMission(i){state.mission=Math.max(0,Math.min(5,i));state.q=questions.findIndex(x=>x.m===state.mission);state.tab='mission';state.showCourse=false;state.feedback=false;render()}
function navigate(i){state.q=Math.max(0,Math.min(questions.length-1,i));state.mission=questions[state.q].m;state.showCourse=false;state.feedback=false;render()}
function openDoc(id){state.doc=id;$('#docModal').classList.add('active');$('#docModalTitle').textContent=`${id} — ${docsLabels[parseInt(id.slice(1))-1]}`;$('#docImg').src=assetUrl(`assets/${id}.png`);$('#docImg').style.width='100%';$('#zoomRange').value=100;$('#docModal').setAttribute('aria-hidden','false')}
function closeDoc(){$('#docModal').classList.remove('active');$('#docModal').setAttribute('aria-hidden','true')}
function header(){return `<div class="brand"><div class="brand-mark">A<span>Q</span></div><div><b>AQUATICC</b><small>OPÉRATION NIVEAU CRITIQUE</small></div></div><div class="progresswrap"><span>ENQUÊTE ${progress()}/27</span><div class="track"><div style="width:${Math.round(progress()/27*100)}%"></div></div></div><div class="time">⏱ 4 h · BTS ATI</div>`}
function left(){return `<div class="navtitle">DOSSIER D'ENQUÊTE</div>${missions.map((m,i)=>`<button class="mission-nav ${state.mission===i?'active':''}" onclick="setMission(${i})"><span class="navnum">0${i+1}</span><span><b>${esc(m.title)}</b><small>${missionProgress(i)} tâches · ${m.mins} min</small></span><span class="arr">›</span></button>`).join('')}<div class="navfoot"><button class="secondary full" onclick="state.tab='archives';render()">▤ Toutes les archives D01–D13</button><button class="secondary full" onclick="state.tab='report';render()">▣ Rapport & export</button><button class="secondary full" onclick="state.tab='components';render()">⌗ Inventaire des composants</button></div>`}
function docbuttons(arr){return `<div class="docbuttons">${arr.map(d=>`<button class="docbtn" onclick="openDoc('${d}')">▤ ${d} <span>↗</span></button>`).join('')}</div>`}
function coursebox(k){let c=courses[k];return `<div class="coursebox"><div class="coursepill">📖 CAPSULE DE COURS · ${esc(c.title)}</div><p>${esc(c.body)}</p><p class="micro">Contrôle de lecture : Expliquez dans votre réponse comment cette méthode s'applique au document consulté.</p></div>`}
function question(){let x=questions[state.q];let r=state.results[x.id]||{};let siblings=questions.filter(t=>t.m===x.m);let pos=siblings.findIndex(t=>t.id===x.id);let ch=x.kind==='choice';let feedback=state.feedback||r.checked;return `<div class="breadcrumb">MISSION 0${x.m+1} <span>›</span> ÉTAPE ${pos+1}/${siblings.length} <span>›</span> QUESTION ${x.id}/27</div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.prompt)}</p><div class="notice">⚑ Travail sur documents uniquement. Ne présentez pas une hypothèse comme une certitude.</div><h3>Pièces utiles à l’enquête</h3><div class="doc-preview-grid">${x.docs.map(d=>`<button class="doc-preview" onclick="openDoc('${d}')" title="Ouvrir ${d}"><img src="${assetUrl('assets/'+d+'.png')}" alt="Aperçu authentique ${d}" loading="lazy"><span>${d} · Cliquer pour agrandir</span></button>`).join('')}</div>${docbuttons(x.docs)}<div class="answerarea"><label class="fieldlabel">${ch?'Sélectionnez votre réponse':'Votre analyse technique et votre raisonnement'}</label>${ch?`<div class="choices">${x.opts.map(o=>`<label class="choice ${r.answer===o?'selected':''}"><input type="radio" name="answer" value="${esc(o)}" ${r.answer===o?'checked':''} onchange="setAnswer(this.value)"><span>${esc(o)}</span></label>`).join('')}</div>`:`<textarea id="answer" placeholder="Décrivez ce que vous avez observé, les repères associés et ce que vous en déduisez..." oninput="setAnswer(this.value)">${esc(r.answer||'')}</textarea>`}<div class="evidence"><label class="fieldlabel">Référence(s) et preuve documentaire (obligatoire pour une validation argumentée)</label><input id="evidence" value="${esc(r.evidence||'')}" placeholder="Ex. D04 : Q1 → KM1 → F1 → M1 ; D06 : voyant..." oninput="setEvidence(this.value)"><label class="fieldlabel">Niveau de certitude</label><select id="certainty" onchange="setCertainty(this.value)"><option value="">— Sélectionnez —</option>${[['Établi','Établi : preuve lisible'],['Probable','Probable : déduction'],['Inconnu','Inconnu : information non confirmée']].map(([v,label])=>`<option value="${v}" ${r.certainty===v?'selected':''}>${label}</option>`).join('')}</select></div></div><div class="actions"><button class="secondary" onclick="toggleCourse()">📖 ${state.showCourse?'Masquer':'Besoin d’aide ? Voir le cours'}</button><button class="primary" onclick="validateAnswer()">✓ Valider mon analyse</button></div>${state.showCourse?coursebox(x.course):''}${feedback?feedbackBox(x,r):''}<div class="nextrow"><button class="secondary" onclick="navigate(${state.q-1})" ${state.q===0?'disabled':''}>← Précédent</button><button class="secondary" onclick="navigate(${state.q+1})" ${state.q===questions.length-1?'disabled':''}>Suivant →</button></div>`}
function feedbackBox(x,r){if(!r.checked)return '';let valid=x.kind==='choice'?r.answer===x.answer:null;return `<div class="feedback ${valid===false?'bad':valid===true?'good':'neutral'}"><b>${valid===true?'✓ Réponse correcte':valid===false?'✕ Réponse à revoir':'✓ Analyse enregistrée — relecture formateur'}</b><p>${x.kind==='choice'?esc(x.feedback):'La réponse rédigée est conservée. Comparez votre raisonnement aux documents originaux ; la validation technique et la note de cette réponse restent du ressort du formateur.'}</p>${x.kind==='text'?`<details><summary>Points d’attention pédagogiques (à consulter après votre proposition)</summary><p>${esc(x.feedback||'Citez vos sources, justifiez vos déductions, et distinguez informations certaines et non confirmées.')}</p></details>`:''}</div>`}
function setAnswer(v){let x=questions[state.q];state.results[x.id]={...(state.results[x.id]||{}),answer:v,checked:false};store();if(x.kind==='choice')render()}
function setEvidence(v){let x=questions[state.q];state.results[x.id]={...(state.results[x.id]||{}),evidence:v,checked:false};store()}
function setCertainty(v){let x=questions[state.q];state.results[x.id]={...(state.results[x.id]||{}),certainty:v,checked:false};store()}
function toggleCourse(){state.showCourse=!state.showCourse;render()}
function validateAnswer(){let x=questions[state.q],r=state.results[x.id]||{};if(!r.answer?.trim()){alert('Rédigez ou choisissez une réponse avant de valider.');return}if(!r.evidence?.trim()){alert('Ajoutez un document et une preuve ou indiquez explicitement « non confirmé » avec justification.');return}if(!r.certainty){alert('Indiquez votre niveau de certitude.');return}r.checked=true;state.results[x.id]=r;state.feedback=true;store();render()}
function missionPage(){let m=missions[state.mission];let items=questions.filter(x=>x.m===state.mission);return `<div class="mission-intro"><span class="eyebrow">DOSSIER 0${state.mission+1} · ${m.mins} MINUTES</span><h2>${esc(m.title)}</h2><p>${esc(m.intro)}</p><div class="mini-meta">${esc(m.subtitle)}</div><div class="missionlinks">${items.map(x=>`<button onclick="navigate(${questions.indexOf(x)})" class="step ${qdone(x)?'done':''} ${questions[state.q].id===x.id?'current':''}">${qdone(x)?'✓':x.id}</button>`).join('')}</div></div>${question()}`}
function archives(){return `<div class="breadcrumb">CENTRE DOCUMENTAIRE</div><h1>Archives AQUATICC</h1><p class="lead">13 pièces authentiques extraites du dossier fourni. Cliquez pour ouvrir en grand et zoomer. Les schémas sont conservés tels qu’ils apparaissent dans les documents originaux, avec leurs limites de lisibilité.</p><div class="archives">${docsLabels.map((label,i)=>`<button onclick="openDoc('D${String(i+1).padStart(2,'0')}')" class="archive"><img loading="lazy" src="${assetUrl(`assets/D${String(i+1).padStart(2,'0')}.png`)}"><span><b>D${String(i+1).padStart(2,'0')}</b><small>${esc(label)}</small></span></button>`).join('')}</div>`}
const componentNames=['Q1','Q2','KM1','KM2','F1','F2','M1','M2','KA3','KA4','KA5','KA6','KA7','KA8','KA9','H3','H4','H5','H6','H7','H8','H9','H10'];
function components(){let savedComp=state.report.components||{};return `<div class="breadcrumb">DOSSIER DE TRAVAIL</div><h1>Fiche de relevé des composants</h1><p class="lead">Reprend la tâche documentaire du TP. Identifiez chaque élément à partir des vrais documents et conservez la preuve. Exportable avec le rapport.</p><div class="tablewrap"><table><thead><tr><th>Repère</th><th>Fonction / rôle</th><th>Preuve / document</th></tr></thead><tbody>${componentNames.map(c=>`<tr><th>${c}</th><td><input aria-label="Fonction ${c}" data-comp="${c}" data-part="role" value="${esc(savedComp[c]?.role||'')}" onchange="saveComp(this)"></td><td><input aria-label="Preuve ${c}" data-comp="${c}" data-part="proof" value="${esc(savedComp[c]?.proof||'')}" onchange="saveComp(this)"></td></tr>`).join('')}</tbody></table></div>`}
function saveComp(el){state.report.components??={};state.report.components[el.dataset.comp]??={};state.report.components[el.dataset.comp][el.dataset.part]=el.value;store()}
const reportFields=[['objet','1. Objet de l’étude','Machine, fonction et documents mobilisés.'],['architecture','2. Architecture de l’installation','Chaînes d’énergie P1/P2, organes de commande et signalisation.'],['fonctionnement','3. Fonctionnement reconstitué','États, transitions, conditions, sources Dxx et degrés de certitude.'],['incidents','4. Analyse des trois situations','Démarches documentaires et hypothèses ouvertes pour A, B et C.'],['incertitudes','5. Incertitudes et vérifications','Mentions illisibles, preuves manquantes et vérifications nécessaires.']];
function reportPage(){return `<div class="breadcrumb">FIN DE MISSION · LIVRABLE</div><h1>Rapport d’expertise</h1><p class="lead">Ce rapport reprend les cinq rubriques du compte rendu officiel. Il n’est pas corrigé automatiquement : votre formateur pourra contrôler la qualité des justifications.</p><label class="fieldlabel">Noms des deux experts</label><input value="${esc(state.names)}" placeholder="Prénom NOM / Prénom NOM" onchange="state.names=this.value;store()"><div class="scoregrid"><div><b>${progress()} / 27</b><span>questions validées / enregistrées</span></div><div><b>${questions.filter(x=>x.kind==='choice'&&state.results[x.id]?.checked&&state.results[x.id]?.answer===x.answer).length} / ${questions.filter(x=>x.kind==='choice').length}</b><span>réponses fermées correctes</span></div><div><b>À vérifier</b><span>analyses techniques par le formateur</span></div></div>${reportFields.map(([key,title,help])=>`<section class="reportsection"><h3>${title}</h3><p class="micro">${help}</p><textarea oninput="state.report['${key}']=this.value;store()" placeholder="Rédigez votre compte rendu...">${esc(state.report[key]||'')}</textarea></section>`).join('')}<div class="actions"><button class="primary" onclick="downloadEvaluationPDF()">↓ Télécharger le dossier complet (PDF)</button><button class="secondary" onclick="downloadJSON()">↓ Sauvegarde complète (.json)</button><button class="secondary" onclick="printReport()">⎙ Imprimer / PDF</button></div><p class="micro">Barème formateur : identification et sources /4 ; puissance, commande et signalisation /5 ; analyse fonctionnelle et niveau de preuve /5 ; situations professionnelles /4 ; compte rendu et vocabulaire /2.</p>`}
function dumpText(){let lines=['AQUATICC — OPÉRATION NIVEAU CRITIQUE','BTS ATI — TRAVAIL DOCUMENTAIRE','Binôme : '+state.names,'Date : '+new Date().toLocaleString('fr-FR'),'',...questions.flatMap(x=>{let r=state.results[x.id]||{};return [`Q${x.id}. ${x.title}`,`Question : ${x.prompt}`,`Réponse : ${r.answer||'(non renseignée)'}`,`Preuves : ${r.evidence||'(non renseignées)'}`,`Niveau : ${r.certainty||'(non renseigné)'}`,'']})];for(let [k,title] of reportFields)lines.push(title,state.report[k]||'', '');lines.push('INVENTAIRE');for(let c of componentNames){let r=state.report.components?.[c]||{};lines.push(`${c} — ${r.role||''} — ${r.proof||''}`)}return lines.join('\n')}
function downloadBlob(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function downloadReport(){downloadBlob('AQUATICC_rapport_'+(state.names.replace(/[^a-z0-9]/gi,'_')||'binome')+'.txt',dumpText(),'text/plain;charset=utf-8')}
function downloadJSON(){downloadBlob('AQUATICC_sauvegarde.json',JSON.stringify({title:'AQUATICC',date:new Date().toISOString(),names:state.names,results:state.results,report:state.report},null,2),'application/json')}
function printReport(){let win=window.open('','_blank');if(!win){alert('Autorisez les fenêtres pour imprimer le rapport.');return}win.document.write('<html><head><meta charset="utf-8"><title>AQUATICC — Rapport</title><style>body{font:14px Arial;white-space:pre-wrap;line-height:1.5;padding:32px}</style></head><body>'+esc(dumpText())+'</body></html>');win.document.close();win.focus();win.print()}
function render(){document.querySelector('#top').innerHTML=header();document.querySelector('#left').innerHTML=left();document.querySelector('#content').innerHTML=state.tab==='archives'?archives():state.tab==='report'?reportPage():state.tab==='components'?components():missionPage();let btn=document.querySelector(`.mission-nav.active`);if(btn)btn.setAttribute('aria-current','step')}
function resetGame(){if(confirm('Effacer toutes les réponses et la progression de ce navigateur ? Cette opération est irréversible sauf si vous avez exporté une sauvegarde.')){localStorage.removeItem(KEY);location.reload()}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDoc()});document.querySelector('#docModal').addEventListener('click',e=>{if(e.target.id==='docModal')closeDoc()});document.querySelector('#zoomRange').addEventListener('input',e=>$('#docImg').style.width=e.target.value+'%');render();

</script>

/* Récompenses de jeu = engagement, sans prétendre évaluer les réponses ouvertes sur 20. */
const miniWon=()=>challenges.filter((c,i)=>v2.mini[i]?.ok).length;
const textDone=()=>questions.filter(q=>q.kind!=='choice'&&qdone(q)).length;
const choiceDone=()=>questions.filter(q=>q.kind==='choice'&&qdone(q)).length;
const scoreXP=()=>v2.opened.length*8+challenges.reduce((s,c,i)=>s+(v2.mini[i]?.ok?Math.max(20,50-10*(v2.attempts[i]||0)):0),0)+textDone()*15+choiceDone()*30;
const grade=()=>{let xp=scoreXP();return xp>=1700?'Expert AQUATICC':xp>=1100?'Analyste industriel':xp>=600?'Technicien enquêteur':xp>=200?'Explorateur documentaire':'Nouvelle recrue'};
const badgeDefs=[
 {id:'doc1',icon:'🔎',name:'Premier indice',desc:'Ouvrir un document authentique',ok:()=>v2.opened.length>=1},
 {id:'doc5',icon:'🗂️',name:'Chasseur d’archives',desc:'Consulter 5 documents différents',ok:()=>v2.opened.length>=5},
 {id:'doc13',icon:'📚',name:'Dossier maîtrisé',desc:'Consulter les 13 pièces D01–D13',ok:()=>v2.opened.length>=13},
 {id:'mini6',icon:'⚡',name:'Éclaireur',desc:'Réussir 6 défis documentaires',ok:()=>miniWon()>=6},
 {id:'mini12',icon:'🧠',name:'Décodeur',desc:'Réussir 12 défis documentaires',ok:()=>miniWon()>=12},
 {id:'mini24',icon:'🏆',name:'Maître des preuves',desc:'Réussir les 24 défis',ok:()=>miniWon()>=24},
 {id:'r10',icon:'📝',name:'Raisonnement',desc:'Valider 10 réponses du TP',ok:()=>progress()>=10},
 {id:'r27',icon:'🎖️',name:'Mission accomplie',desc:'Valider les 27 réponses du TP',ok:()=>progress()>=27}
];
function rewardPanel(){return `<section class="reward-panel"><div class="reward-top"><div><span class="eyebrow">RÉCOMPENSES DU BINÔME</span><h2>🏅 ${grade()}</h2></div><div class="xp-number">${scoreXP()} <small>XP</small></div></div><p class="reward-explain">8 XP par pièce consultée · 50 XP par défi réussi du premier coup (20 XP minimum après erreurs) · 15 XP pour une analyse rédigée validée · 30 XP pour une question fermée correcte. <strong>Les XP ne sont pas une note sur 20.</strong></p><div class="badge-grid">${badgeDefs.map(b=>`<div class="reward-badge ${b.ok()?'unlocked':'locked'}" title="${b.desc}"><span>${b.icon}</span><b>${b.name}</b><small>${b.desc}</small>${b.ok()?'<em>Débloqué</em>':'<em>À gagner</em>'}</div>`).join('')}</div></section>`}
const originalOpenDoc=openDoc;
openDoc=function(id){if(!v2.opened.includes(id)){v2.opened.push(id);persistV2()}originalOpenDoc(id)};

function miniProgress(m){return challenges.filter(c=>c.m===m&&v2.mini[challenges.indexOf(c)]?.ok).length+'/'+challenges.filter(c=>c.m===m).length}
function character(key,msg,cls=''){let p=crew[key];return `<div class="character ${cls}"><img src="${assetUrl(p.src)}" alt="Portrait illustré de ${p.name}"><div><div class="charname">${p.name}<span> · ${p.role}</span></div><p>${esc(msg)}</p></div></div>`}
function homePage(){return `<div class="hero" role="img" aria-label="Affiche illustrée AQUATICC Dossier Rouge : équipe d’enquête industrielle"><div class="hero-info"><div class="eyebrow">BTS ATI · DOSSIER TECHNIQUE CLASSIFIÉ</div><h1>AQUATICC <em>DOSSIER ROUGE</em></h1><p>Une installation de transfert d’eau. Treize pièces techniques. Deux pompes. Une mission : <strong>comprendre son fonctionnement uniquement à partir des documents.</strong></p><button class="primary huge" onclick="startInvestigation()">▶ ${progress()?'REPRENDRE L’ENQUÊTE':'COMMENCER L’ENQUÊTE'}</button></div></div>${rewardPanel()}<div class="home-stats"><div><b>27</b><small>questions du TP</small></div><div><b>24</b><small>défis documentaires</small></div><div><b>13</b><small>documents originaux</small></div><div><b>4 h</b><small>séance complète</small></div></div><div class="panel"><h2>08 h 17 — Appel du responsable</h2>${character('leroy','L’installation AQUATICC doit être expliquée à l’équipe d’exploitation. Le matériel est inaccessible. Vous êtes nos experts documentaires : retrouvez la fonction globale, les deux départs moteurs, les commandes et les éléments de signalisation. Ne confondez jamais fait lu, déduction et hypothèse.') }<div class="rules"><b>Règle d’or : aucune conclusion sans source.</b><span>Consultation D01–D13 → réponse → preuve → niveau de certitude → validation.</span></div></div><h2>Votre équipe d’enquête</h2><div class="crew-grid">${Object.keys(crew).map(k=>`<article class="crew-card"><img src="${assetUrl(crew[k].src)}" alt="${crew[k].name}"><strong>${crew[k].name}</strong><small>${crew[k].role}</small></article>`).join('')}</div><div class="panel"><h2>Le parcours d’investigation</h2><p>Six chapitres, un inventaire des composants et un rapport final. Le jeu comprend <b>24 mini-défis complémentaires</b> ; ils ne remplacent pas la recherche dans les vrais documents. Les réponses rédigées seront relues par le formateur.</p><div class="chaptercards">${missions.map((m,i)=>`<button onclick="startInvestigation(${i})"><span>0${i+1}</span><strong>${esc(m.title)}</strong><small>${m.mins} min · ${miniProgress(i)} défis</small></button>`).join('')}</div></div>`}
function startInvestigation(m=0){v2.intro=true;persistV2();setMission(m)}
function miniSection(m){let arr=challenges.map((c,i)=>({...c,i})).filter(c=>c.m===m);return `<section class="minis"><div class="minis-head"><div><span class="eyebrow">DÉFIS DE L’ARCHIVISTE</span><h2>4 micro-enquêtes supplémentaires</h2><p>Consultez la pièce citée, choisissez une hypothèse et vérifiez l’explication. Ces exercices complètent le TP original.</p></div><b>${miniProgress(m)}</b></div>${arr.map(c=>{let r=v2.mini[c.i]||{};return `<div class="mini-card"><div class="mini-top"><span>Défi ${c.i+1}/24 · ${c.d} · +${Math.max(20,50-10*(v2.attempts[c.i]||0))} XP</span><span>${r.ok?'✓ Résolu':'À résoudre'}</span></div><h3>${esc(c.t)}</h3><p>${esc(c.q)}</p><div class="mini-options">${c.o.map((opt,j)=>`<button class="mini-choice ${r.choice===j?'selected':''} ${r.checked&&j===c.a?'correct':''}" onclick="chooseMini(${c.i},${j})">${String.fromCharCode(65+j)}. ${esc(opt)}</button>`).join('')}</div><div class="mini-actions"><button class="secondary" onclick="openDoc('${c.d}')">▤ Ouvrir ${c.d}</button><button class="primary" onclick="checkMini(${c.i})" ${r.ok?'disabled':''}>${r.ok?'✓ Validé':'Vérifier mon analyse'}</button></div>${r.checked?`<div class="mini-feedback ${r.ok?'good':'bad'}">${character(r.ok?'elise':'ombre',r.ok?c.why:'Cette proposition ne tient pas face au dossier. Retourne vérifier '+c.d+' avant de conclure.')}</div>`:''}</div>`}).join('')}</section>`}
function chooseMini(i,j){if(v2.mini[i]?.ok)return;v2.mini[i]={choice:j,checked:false,ok:false};persistV2();render()}
function checkMini(i){let r=v2.mini[i]||{};if(r.choice===undefined){alert('Sélectionnez une réponse après avoir consulté le document.');return}r.checked=true;r.ok=r.choice===challenges[i].a;if(!r.ok){v2.errors++;v2.attempts[i]=(v2.attempts[i]||0)+1}v2.mini[i]=r;persistV2();render()}
const oldHeader=header,oldLeft=left,oldQuestion=question,oldValidateAnswer=validateAnswer,oldReportPage=reportPage,oldDumpText=dumpText;
header=function(){return `<div class="brand" onclick="state.tab='home';render()" style="cursor:pointer"><div class="brand-mark">A<span>Q</span></div><div><b>AQUATICC</b><small>DOSSIER ROUGE · CELLULE D'ENQUÊTE</small></div></div><div class="progresswrap"><span>🏅 ${scoreXP()} XP · ${grade()} · ENQUÊTE ${progress()}/27 · DÉFIS ${miniWon()}/24</span><div class="track"><div style="width:${Math.round((progress()+Object.values(v2.mini).filter(a=>a.ok).length)/51*100)}%"></div></div></div><div class="time">◷ 4 h · BTS ATI</div>`};
left=function(){return `<div class="navtitle">CELLULE AQUATICC</div><button class="secondary full" onclick="state.tab='home';render()">⌂ Accueil / briefing</button><div class="navtitle" style="margin-top:22px">MISSIONS</div>${missions.map((m,i)=>`<button class="mission-nav ${state.mission===i&&state.tab==='mission'?'active':''}" onclick="setMission(${i})"><span class="navnum">0${i+1}</span><span><b>${esc(m.title)}</b><small>${missionProgress(i)} questions · ${miniProgress(i)} défis</small></span><span class="arr">›</span></button>`).join('')}<div class="navfoot"><button class="secondary full" onclick="state.tab='archives';render()">▤ Archives D01–D13</button><button class="secondary full" onclick="state.tab='rewards';render()">🏆 Récompenses et grades</button><button class="secondary full" onclick="state.tab='components';render()">⌗ Inventaire de composants</button><button class="secondary full" onclick="state.tab='report';render()">▣ Rapport & export</button></div><div class="side-character">${character('tom','Retrouve une information ? Cite son document. Une conclusion non sourcée ne vaut rien.')}</div>`};
question=function(){let base=oldQuestion();return `<div class="question-shell">${character('elise','Pour cette question, ouvre les pièces utiles avant de répondre. La preuve et le niveau de certitude sont obligatoires.')} ${base}</div>`};
validateAnswer=function(){let x=questions[state.q],r=state.results[x.id]||{};if(!r.answer?.trim()||!r.evidence?.trim()||!r.certainty){oldValidateAnswer();return}if(x.kind==='choice'&&r.answer!==x.answer){v2.errors++;persistV2()}oldValidateAnswer()};
missionPage=function(){let m=missions[state.mission];let items=questions.filter(x=>x.m===state.mission);let [who,speech]=briefings[state.mission];return `<div class="mission-intro"><span class="eyebrow">CHAPITRE 0${state.mission+1} · ${m.mins} MIN · DOSSIER CLASSIFIÉ</span><h2>${esc(m.title)}</h2><p>${esc(m.intro)}</p><div class="mini-meta">${esc(m.subtitle)}</div>${character(who,speech)}<div class="missionlinks">${items.map(x=>`<button onclick="navigate(${questions.indexOf(x)})" class="step ${qdone(x)?'done':''} ${questions[state.q].id===x.id?'current':''}">${qdone(x)?'✓':x.id}</button>`).join('')}</div></div>${question()}${miniSection(state.mission)}`};
reportPage=function(){return `<div class="report-hero">${character('leroy','Votre mission se termine par un rapport technique. Je veux la fonction globale, les deux chaînes de puissance, la commande, la signalisation, les trois situations et les incertitudes clairement assumées.')}</div>${oldReportPage()}${rewardPanel()}<div class="end-brief"><h2>Bilan des mini-enquêtes</h2><p>${Object.values(v2.mini).filter(a=>a.ok).length} / 24 défis résolus · ${v2.errors} essais incorrects enregistrés. Les essais ne retirent aucun point à la note du TP.</p><p>La réussite des défis ne constitue pas une note sur 20. Le compte rendu et les justifications doivent être évalués par le formateur selon son barème.</p></div>`};
dumpText=function(){return oldDumpText()+'\n\nXP : '+scoreXP()+' — Grade : '+grade()+'\nDÉFIS COMPLÉMENTAIRES : '+Object.values(v2.mini).filter(a=>a.ok).length+'/24\n'+challenges.map((c,i)=>`Défi ${i+1} : ${v2.mini[i]?.ok?'Réussi':'Non validé'} — document ${c.d}`).join('\n')};
render=function(){document.querySelector('#top').innerHTML=header();document.querySelector('#left').innerHTML=left();document.querySelector('#content').innerHTML=state.tab==='home'?homePage():state.tab==='archives'?archives():state.tab==='report'?reportPage():state.tab==='components'?components():state.tab==='rewards'?rewardPanel():missionPage()};
state.tab='home';document.title='AQUATICC — Dossier Rouge | BTS ATI';render();
/* Une mauvaise réponse fermée ne doit pas valider la question. */
qdone=function(x){let r=state.results[x.id];return !!r&&r.checked&&r.answer?.trim().length>0&&(x.kind!=='choice'||r.answer===x.answer)};
resetGame=function(){if(confirm('Effacer la progression de cette version dans ce navigateur ? Exportez d’abord votre rapport si nécessaire.')){localStorage.removeItem(KEY);localStorage.removeItem(VERSION_KEY);location.reload()}};

</script>
<style id="aquaticc-evaluation-v5">

</style><script>
/* AQUATICC V5 — bilan de compétences, barème officiel et correction argumentée */
const criteriaV5=[
 {id:'identification',label:'Identification et sources',max:4,advice:'Relis D01, D02, D08 et D09. Pour chaque information, indique un repère et une pièce.'},
 {id:'schemas',label:'Puissance / commande / signalisation',max:5,advice:'Retrace Q1 → KM1 → F1 → M1 et Q2 → KM2 → F2 → M2 avec D04 ; complète avec D05 et D06.'},
 {id:'fonctionnement',label:'Fonctionnement et niveau de preuve',max:5,advice:'Reconstitue les relations demande → contacteur → moteur → voyant, en séparant établi, probable et inconnu.'},
 {id:'situations',label:'Situations professionnelles',max:4,advice:'Pour les trois situations, cite les documents à consulter et évite de conclure à une cause physique sans vérification.'},
 {id:'rapport',label:'Compte rendu et vocabulaire',max:2,advice:'Organise ton compte rendu avec fonction globale, architecture, fonctionnement, incidents et incertitudes.'}
];
let v5={grades:{},comment:''};try{let o=JSON.parse(localStorage.getItem('aquaticc_v5_eval')||'{}');v5.grades=o.grades||{};v5.comment=o.comment||''}catch(e){}
function saveV5(){localStorage.setItem('aquaticc_v5_eval',JSON.stringify(v5))}
function gradeCriterion(id,value){const c=criteriaV5.find(x=>x.id===id),s=String(value).replace(',','.').trim();if(!s){delete v5.grades[id]}else{const n=Number(s);if(!Number.isFinite(n)||n<0||n>c.max){alert('Saisir une valeur entre 0 et '+c.max);return}v5.grades[id]=n}saveV5();render()}
function saveV5Comment(value){v5.comment=value;saveV5()}
function objectiveV5(){let closed=questions.filter(q=>q.kind==='choice');let correct=closed.filter(q=>state.results[q.id]?.checked&&state.results[q.id]?.answer===q.answer).length;let goodMini=challenges.filter((c,i)=>v2.mini[i]?.ok).length;let total=closed.length+challenges.length;return {closed:correct,closedTotal:closed.length,mini:goodMini,miniTotal:challenges.length,total,correct:correct+goodMini,score:total?Math.round((correct+goodMini)*200/total)/10:0}}
function officialV5(){let complete=criteriaV5.every(c=>v5.grades[c.id]!==undefined);return {complete,score:complete?Math.round(criteriaV5.reduce((a,c)=>a+v5.grades[c.id],0)*10)/10:null}}
function feedbackV5(){let o=objectiveV5(),frac=o.correct/o.total,allAnswered=challenges.every((c,i)=>v2.mini[i]?.checked)||false;let closeAnswered=questions.filter(q=>q.kind==='choice').every(q=>state.results[q.id]?.checked);let missing=o.total-o.correct;const weaknesses=[];
for(let i=0;i<6;i++){const cs=challenges.map((c,j)=>({...c,index:j})).filter(c=>c.m===i);const bad=cs.filter(c=>!v2.mini[c.index]?.ok);if(bad.length>=2)weaknesses.push({m:i,n:bad.length})}
const adv=weaknesses.map(w=>({m:w.m,t:missions[w.m].title,advice:[
'Travaille la fonction globale sur D02, puis justifie ton synoptique.',
'Utilise la nomenclature D08–D09 et retrouve les repères sur D04–D06.',
'Reconstitue les chaînes de puissance sur D04 et sépare énergie, commande et signalisation.',
'Associe chaque voyant à un contact sur D06 et souligne les limites de D05.',
'Dans chaque situation, présente plusieurs hypothèses documentaires et aucune cause non prouvée.',
'Entraîne-toi à citer les pièces Dxx et à rédiger les incertitudes.'
][w.m]}));
let good=frac>=.8,medium=frac>=.5;
let message=good?'Excellent travail : les relations entre documents sont largement maîtrisées. Pour franchir le dernier palier, justifiez chaque affirmation et signalez les zones illisibles.':medium?'Les bases sont présentes, mais certaines lectures demandent encore de la précision. Reprenez les folios et comparez les fonctions des composants.':'Plusieurs liens entre les documents restent fragiles. Reprenez la fonction globale, les deux départs moteur et les associations de signalisation dans cet ordre.';
return {o,allAnswered,closeAnswered,good,medium,message,advice:adv.slice(0,4),missing}
}
function evaluationPageV5(){let d=feedbackV5(),o=d.o,f=officialV5(),grade=f.complete?f.score:o.score;let speaker=f.complete?(grade>=14?'leroy':grade>=10?'elise':'ombre'):(d.good?'elise':d.medium?'tom':'ombre');let dialogue=f.complete?(grade>=14?'Rapport validé. Vos analyses sont solides et argumentées. Continuez à citer précisément les preuves.':grade>=10?'Votre analyse avance. Appuyez davantage vos conclusions sur les folios, et reprenez les points faibles ci-dessous.':'Oups… vous avez cru que le dossier allait se lire tout seul ? Retournez aux documents et prouvez ce que vous avancez. Élise vous indique la méthode juste après.'):(d.good?'Beau travail sur les défis ! Maintenant, vos justifications rédigées doivent être relues par le formateur.':d.medium?'La progression est réelle. Identifiez d’abord les documents liés aux réponses incorrectes.':'Aïe ! Le dossier ne valide pas vos suppositions. Retournez lire les pièces : un indice ne remplace jamais une preuve.');
let advice=d.advice.length?d.advice:[{t:'Prochaine étape',advice:'Reprends une réponse rédigée par mission et vérifie qu’elle cite un document et un niveau de certitude.'}];
return '<section class="evaluation-panel"><div class="eyebrow">BILAN FINAL · DOSSIER AQUATICC</div><h2>Évaluation et débrief personnalisé</h2><div class="eval-scores"><div><small>Score automatique provisoire</small><strong>'+o.score.toFixed(1).replace('.',',')+' / 20</strong><span>'+o.correct+' / '+o.total+' réponses objectives correctes</span></div><div><small>Note officielle du TP</small><strong>'+(f.complete?f.score.toFixed(1).replace('.',',')+' / 20':'À évaluer')+'</strong><span>Barème formateur : 4 + 5 + 5 + 4 + 2</span></div></div><p class="micro">Le score automatique est une conversion des '+o.miniTotal+' mini-défis et '+o.closedTotal+' questions fermées. Il ne tient pas compte de la qualité des analyses, des preuves ni du compte rendu. Les questions encore non résolues comptent comme non acquises dans ce score provisoire.</p>'+character(speaker,dialogue)+(speaker==='ombre'?character('elise',d.message):'<p class="eval-method">'+esc(d.message)+'</p>')+'<h3>Conseils prioritaires</h3><ul class="eval-advice">'+advice.map(a=>'<li><strong>'+esc(a.t)+'</strong> — '+esc(a.advice)+'</li>').join('')+'</ul><details class="formateur-grade"><summary>🔐 Espace formateur — renseigner la note finale /20</summary><p class="micro">Les notes saisies ci-dessous sont enregistrées uniquement dans le navigateur de cet appareil ; elles ne constituent pas une validation sécurisée d’identité.</p><div class="grade-grid">'+criteriaV5.map(c=>'<label>'+esc(c.label)+' <small>/'+c.max+'</small><input type="number" min="0" max="'+c.max+'" step="0.5" value="'+(v5.grades[c.id]??'')+'" onchange="gradeCriterion(\''+c.id+'\',this.value)" placeholder="—"></label>').join('')+'</div><label>Commentaire du formateur<textarea oninput="saveV5Comment(this.value)" placeholder="Observation complémentaire...">'+esc(v5.comment)+'</textarea></label></details><div class="actions"><button class="primary" onclick="downloadEvaluationPDF()">↓ Télécharger le bilan corrigé (PDF)</button><button class="secondary" onclick="printEvaluationV5()">⎙ Imprimer / Enregistrer en PDF</button></div></section>'
}
function correctionV5(){const f=officialV5(),d=feedbackV5();let lines=['AQUATICC — DOSSIER ROUGE','BILAN ET CORRECTION ARGUMENTÉE','Équipe : '+(state.names||'Non renseignée'),'Date : '+new Date().toLocaleString('fr-FR'),'','SCORE AUTOMATIQUE INDICATIF : '+d.o.score.toFixed(1)+'/20 ('+d.o.correct+'/'+d.o.total+' réponses objectives)','NOTE FINALE DU TP : '+(f.complete?f.score+'/20 — renseignée par le formateur':'À compléter par le formateur'),'Note : le score automatique ne corrige pas les réponses longues.',''];
lines.push('BARÈME OFFICIEL');for(const c of criteriaV5){lines.push(c.label+' : '+(v5.grades[c.id]??'non évalué')+'/'+c.max)}lines.push('');if(v5.comment)lines.push('COMMENTAIRE FORMATEUR : '+v5.comment,'');
lines.push('CONSEILS PERSONNALISÉS');for(const a of (d.advice.length?d.advice:[{t:'Méthode',advice:'Citer les documents et signaler les incertitudes.'}]))lines.push('- '+a.t+' : '+a.advice);lines.push('');
lines.push('CORRECTION DES QUESTIONS FERMÉES DU TP');for(const q of questions.filter(x=>x.kind==='choice')){const a=state.results[q.id]||{};lines.push('Q'+q.id+' — '+q.title,'Question : '+q.prompt,'Votre réponse : '+(a.answer||'Non renseignée'),'Réponse attendue : '+q.answer,'Résultat : '+(a.checked&&a.answer===q.answer?'CORRECT':'À REPRENDRE'),'Explication : '+(q.feedback||'À vérifier dans les documents '+q.docs.join(', ')),'Source(s) : '+q.docs.join(', '),'')}
lines.push('CORRECTION ARGUMENTÉE DES 24 DÉFIS');for(const [i,c] of challenges.entries()){let r=v2.mini[i]||{};lines.push('Défi '+(i+1)+' — '+c.t,'Question : '+c.q,'Votre réponse : '+(r.choice===undefined?'Non renseignée':c.o[r.choice]),'Réponse attendue : '+c.o[c.a],'Résultat : '+(r.ok?'CORRECT':'À REPRENDRE'),'Justification : '+c.why,'Document : '+c.d,'')}
lines.push('QUESTIONS RÉDIGÉES — À VALIDER PAR LE FORMATEUR');for(const q of questions.filter(x=>x.kind!=='choice')){let r=state.results[q.id]||{};lines.push('Q'+q.id+' — '+q.title,'Votre réponse : '+(r.answer||'Non renseignée'),'Preuve citée : '+(r.evidence||'Non renseignée'),'Sources attendues : '+q.docs.join(', '),'Repère de correction : '+(q.feedback||'Vérifier la pertinence de l’analyse, les repères et le niveau de certitude ; cette réponse n’a pas été notée automatiquement.'),'')}
lines.push('RAPPORT PROFESSIONNEL');for(const [k,title] of reportFields)lines.push(title,state.report[k]||'Non renseigné','');
lines.push('Rappel : une interprétation doit rester PROBABLE si D05 ou une autre pièce ne permet pas une confirmation visuelle.');return lines.join('\n')}
function downloadEvaluationV5(){downloadBlob('AQUATICC_BILAN_CORRIGE_'+(state.names.replace(/[^a-z0-9]/gi,'_')||'binome')+'.txt',correctionV5(),'text/plain;charset=utf-8')}
function printEvaluationV5(){const w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres pour imprimer le bilan.');return}w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>AQUATICC — Bilan corrigé</title><style>body{font:13px/1.5 Arial,sans-serif;padding:32px;white-space:pre-wrap;max-width:850px;margin:auto}</style></head><body>'+esc(correctionV5())+'</body></html>');w.document.close();w.focus();w.print()}
const reportPageV4=reportPage;reportPage=function(){return reportPageV4()+evaluationPageV5()};
const dumpTextV4=dumpText;dumpText=function(){return dumpTextV4()+'\n\n'+correctionV5()}
</script><script>
let aquaticcPdfPromise=null;
async function aquaticcPdfLibrary(){
 if(window.jspdf?.jsPDF)return window.jspdf.jsPDF;
 if(aquaticcPdfPromise)return aquaticcPdfPromise;
 aquaticcPdfPromise=(async()=>{
  for(const url of ['https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js']){
   try{await new Promise((ok,fail)=>{const e=document.createElement('script');e.src=url;e.onload=ok;e.onerror=fail;document.head.appendChild(e)});if(window.jspdf?.jsPDF)return window.jspdf.jsPDF}catch(e){}
  }
  throw new Error('Connexion nécessaire pour charger le moteur PDF.');
 })();
 try{return await aquaticcPdfPromise}finally{aquaticcPdfPromise=null}
}
function pdfSafe(x){return String(x??'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/→/g,' -> ').replace(/•/g,'-').replace(/✓/g,'OK').replace(/[\u{1F300}-\u{1FAFF}]/gu,'').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'')}
async function downloadEvaluationPDF(){
 const buttons=[...document.querySelectorAll('button[onclick="downloadEvaluationPDF()"]')];
 buttons.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='Génération du PDF…'});
 try{
  const Constructor=await aquaticcPdfLibrary();
  const pdf=new Constructor({unit:'mm',format:'a4',compress:true});
  const left=16,usable=178;let y=40,page=1;
  function header(){
   pdf.setFillColor(7,23,41);pdf.rect(0,0,210,29,'F');
   pdf.setFillColor(231,70,78);pdf.rect(0,28,210,1.5,'F');
   pdf.setTextColor(245,191,100);pdf.setFont('helvetica','bold');pdf.setFontSize(17);
   pdf.text('AQUATICC - DOSSIER ROUGE',left,14);
   pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(218,229,240);
   pdf.text('BTS ATI - Rapport, note et correction argumentee',left,23);
  }
  function footer(){
   pdf.setDrawColor(196,213,221);pdf.line(left,281,194,281);
   pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(100,118,129);
   pdf.text('Justifiez vos conclusions avec D01 a D13',left,287);
   pdf.text('Page '+page,194,287,{align:'right'});
  }
  function next(){footer();pdf.addPage();page++;y=40;header()}
  function ensure(n){if(y+n>277)next()}
  function write(s,{size=9,bold=false,color=[31,51,66]}={}){
   pdf.setFont('helvetica',bold?'bold':'normal');pdf.setFontSize(size);pdf.setTextColor(...color);
   const lines=pdf.splitTextToSize(pdfSafe(s),usable),dy=size*.39+1.7;
   for(const line of lines.length?lines:['']){ensure(dy+1);pdf.text(line,left,y);y+=dy}
   y+=1.7;
  }
  function section(s){ensure(16);y+=3;pdf.setFillColor(18,50,73);pdf.roundedRect(left,y-5,usable,10,1,1,'F');pdf.setFontSize(11);pdf.setFont('helvetica','bold');pdf.setTextColor(246,197,112);pdf.text(pdfSafe(s).slice(0,88),left+4,y+1.7);y+=13}
  header();
  const o=objectiveV5(),official=officialV5(),fb=feedbackV5();
  write('Binome : '+(state.names||'Non renseigne'),{size:11,bold:true});
  write('Date : '+new Date().toLocaleDateString('fr-FR'));
  section('SYNTHESE DES RESULTATS');
  write('Score automatique indicatif : '+o.score.toFixed(1).replace('.',',')+'/20 ('+o.correct+'/'+o.total+' reponses)',{size:12,bold:true});
  write('Note officielle : '+(official.complete?official.score.toFixed(1).replace('.',',')+'/20':'A completer par le formateur'),{size:12,bold:true,color:[150,58,61]});
  write('Le score automatique couvre les mini-defis et questions fermees, et non les analyses redigees.');
  section('DEBRIEF ET CONSEILS PERSONNALISES');
  write(fb.message,{size:10,bold:true});
  for(const a of fb.advice)write('- '+a.t+' : '+a.advice);
  if(!fb.advice.length)write('Conseil : justifier chaque affirmation par un repere, un folio et un niveau de certitude.');
  section('BAREME /20');
  for(const c of criteriaV5)write(c.label+' : '+(v5.grades[c.id]??'non evalue')+' / '+c.max);
  if(v5.comment)write('Commentaire du formateur : '+v5.comment,{bold:true});
  section('CORRECTION DETAILLEE');
  let inDetail=false;
  for(const line of correctionV5().split('\n')){
   if(line.startsWith('CORRECTION DES QUESTIONS FERMÉES')||line.startsWith('CORRECTION ARGUMENTÉE DES 24')||line.startsWith('QUESTIONS RÉDIGÉES')||line==='RAPPORT PROFESSIONNEL'){inDetail=true;section(line);continue}
   if(!inDetail)continue;
   write(line,{size:8.8,bold:/^(Q\d+|Défi \d+|Réponse attendue|Justification|Résultat)/.test(line)});
  }
  footer();
  pdf.save('AQUATICC_BILAN_CORRIGE_'+(state.names.replace(/[^a-z0-9]/gi,'_')||'binome')+'.pdf');
 }catch(e){alert('Erreur lors de la génération du PDF : '+e.message)}
 finally{buttons.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||'Exporter le PDF'})}
}
</script></body></html>
